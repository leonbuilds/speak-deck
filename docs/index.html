<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>YuzoAI · 演讲库</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"/>

</head>
<body>

<div class="page">
  <header class="hero">
    <div class="brand">
      <div class="brand-orb"></div>
      <div>
        <div class="brand-title">YuzoAI · 演讲库</div>
        <div class="brand-sub">阿亮 · 十二年研发 · AI Agent 实战</div>
      </div>
    </div>
    <div class="hero-meta">1 场演讲</div>
  </header>

  
    <div class="filters">
      <button class="chip active" data-scenario="">全部</button>
      <button class="chip" data-scenario="同行分享（入门 1 个月开发者偏多）">同行分享（入门 1 个月开发者偏多）</button>
    </div>
  

  <main>
    
    <section class="year-block">
      <h2 class="year-label">2026</h2>
      <div class="talk-grid">
        
    <a class="talk-card" href="talks/2026-05-24_AI%E8%90%BD%E5%9C%B0%E5%AE%9E%E8%B7%B5/slides.html" data-scenario="同行分享（入门 1 个月开发者偏多）">
      <div class="card-top">
        <span class="card-date">05 · 24</span>
        <span class="card-tag">同行分享（入门 1 个月开发者偏多）</span>
      </div>
      <h3 class="card-title">AI落地实践</h3>
      <p class="card-purpose">让&quot;还没开始&quot;的人**今晚就能动手**做出第一个产品；让&quot;做了第一个&quot;的人理解怎么把它做大、怎么进企业</p>
      <div class="card-meta">
        <span>⏱ 40 分钟 · 15 页 · 每页约 2.5 分钟</span>
        <span>📄 15 页</span>
        <span>🎧 音频</span>
      </div>
      <div class="card-cta">
        🎬 打开幻灯片 →
      </div>
    </a>
  
      </div>
    </section>
  
  </main>

  <footer class="footer">
    Built with SpeakDeck · 2026-05-20
  </footer>
</div>

<script>
  // 场景筛选
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const sc = chip.dataset.scenario;
      document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
      document.querySelectorAll('.talk-card').forEach(card => {
        const match = !sc || card.dataset.scenario === sc;
        card.style.display = match ? '' : 'none';
      });
      // 隐藏空年份
      document.querySelectorAll('.year-block').forEach(yb => {
        const visible = [...yb.querySelectorAll('.talk-card')].some(c => c.style.display !== 'none');
        yb.style.display = visible ? '' : 'none';
      });
    });
  });
</script>

</body>
</html>
